[workspace]
# release-plz's default `git_release_type = "auto"` marks any 0.x.y version as a
# GitHub pre-release. kimün is pre-1.0 but ships these as stable, so `auto` wrongly
# flagged 0.17.0/0.18.0 as pre-releases (breaking the "Latest release" badge and
# the API `prerelease` flag the update checker would otherwise trust). Force prod:
# release-plz only ever produces plain versions from conventional commits. Real
# pre-releases are tagged with a hyphenated version (…-beta.N) outside release-plz.
git_release_type = "prod"

# The repo publishes three release series from one tag namespace, and GitHub's
# "Latest" badge is whichever release was published (or last updated) most
# recently. Only the app should ever wear it: `git_release_latest = false` keeps
# kimun_core and kimun_server out of the running. build.yml / build-server.yml
# set `make_latest` on their asset-attach step for the same reason — updating a
# release re-claims the badge unless told otherwise.
[[package]]
name = "kimun_core"
git_tag_name = "kimun_core-v{{ version }}"
git_release_latest = false

# `semver_check = false` because this crate's `[lib]` is not an API anyone
# depends on: it exists so the `kimun` binary and the integration tests in
# `tui/tests` can share the app's internals, and it re-exports them wholesale.
# cargo-semver-checks reads that as a public contract, so an ordinary internal
# refactor counts as a breaking change — and below 1.0 a breaking change is the
# *only* thing that bumps the minor (`features_always_increment_minor` is off by
# default, so even `feat` commits bump the patch). That is how a release of nine
# fixes and four refactors, with no `feat` and no `!` in it, proposed 0.24.0.
# Worse, it only happened in CI: release-plz skips the check silently when
# cargo-semver-checks is absent, which it is on a normal dev machine, so local
# dry runs said patch and CI said minor. The app crate now bumps off its commits
# alone — a minor means someone wrote `!` or `BREAKING CHANGE`.
#
# Deliberately NOT set on kimun_core: that one is a real library with real
# dependents (this crate pins it with `=`), and the check is what catches the
# mistake that already bit once — core 0.2.32 shipped an API break as a patch,
# which broke `cargo package` of the 0.22.1 tarball and stalled release-plz (see
# the comment on the `kimun_core` dependency in tui/Cargo.toml).
[[package]]
name = "kimun-notes"
git_tag_name = "kimun-notes-v{{ version }}"
semver_check = false

# Server ships as GitHub release binaries only (build-server.yml triggers on the
# tag); it is a binary, not a library, so no crates.io publish. `publish = false`
# alone is not enough: release-plz would still consult crates.io for the latest
# release, find nothing, and treat every run as an unreleased first version —
# never bumping past it. `git_only` makes it read the kimun_server-v* tags instead.
[[package]]
name = "kimun_server"
git_tag_name = "kimun_server-v{{ version }}"
git_release_latest = false
publish = false
git_only = true

# `ropetext` and `kimun_server_client` used to be listed here. Both are now
# modules inside kimun-notes (`tui/src/ropetext`, `tui/src/server_client`) and
# have no manifest of their own. crates.io refuses to publish a crate that
# path-depends on an unpublished one, and adding a version requirement does not
# help — cargo strips the `path` and then demands the crate exist in the
# registry. So a workspace member kimun-notes depends on has only two ends:
# published forever, or not a crate. Neither had an API worth stabilising, so
# they stopped being crates. kimun_server_client 0.1.0–0.2.1 remain on
# crates.io, unmaintained and unreferenced; they are not yanked, because yanking
# would break anyone who already resolved them.
