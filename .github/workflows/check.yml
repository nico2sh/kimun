# Test workflow: Run tests on every platform Kimun ships for, plus a
# compile-check for the one release target that has no runner to test on.
# Triggered on pushes to main, pull requests, and manual dispatch
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

name: test

# On PRs, cancel an in-progress run when a new commit is pushed. On main,
# group by ref so successive pushes don't stomp on each other.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. A Windows-only failure must not hide whether
      # macOS passed — with three OSes the first red one is rarely the whole
      # story, and re-running to find out costs another full matrix.
      fail-fast: false
      matrix:
        include:
          # `lint` marks the one runner that also carries the
          # platform-independent gates (fmt, clippy, benches, docs, the module
          # boundary). Running them three times would triple the slowest steps
          # to re-derive identical answers; what the other two are here for is
          # the platform-*dependent* half — `#[cfg(windows)]` code that has
          # never been compiled outside a lib-only `cargo check`, and the
          # case-insensitive-filesystem paths (`CASE_INSENSITIVE_FS` in
          # core/src/nfs) that Linux never exercises.
          - name: Linux
            os: ubuntu-latest
            lint: true
          - name: macOS ARM
            os: macos-latest
            lint: false
          - name: Windows
            os: windows-latest
            lint: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Format check
        if: matrix.lint
        run: cargo fmt --all -- --check

      # `tui/src/ropetext` and `tui/src/server_client` were workspace crates,
      # folded in because crates.io will not publish a crate that path-depends on
      # an unpublished one. What made them crates was not the manifest but the
      # boundary — nothing kimün-flavoured could reach inside, because a separate
      # crate cannot say `crate::settings::Theme`. A module can, so the compiler
      # stopped enforcing it and this step took over. Keeping the rule keeps the
      # option of `git mv`-ing either one back out into a crate of its own.
      - name: Module boundary (ropetext, server_client stay extractable)
        if: matrix.lint
        run: |
          # Comment lines are dropped first: the module docs state the rule, and
          # stating it means writing `crate::`. Only real paths are checked.
          leaks=$(grep -rn --include='*.rs' -E '\bcrate::' \
                    tui/src/ropetext tui/src/server_client \
                  | grep -vE '^[^:]+:[0-9]+: *//' \
                  | grep -vE '\bcrate::(ropetext|server_client)::' || true)
          if [ -n "$leaks" ]; then
            echo "::error::These modules must not reach into the rest of kimün:"
            echo "$leaks"
            exit 1
          fi

      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Not redundant with the clippy step above, despite both saying
      # --all-targets: clippy builds under the *dev* profile, where
      # debug_assertions is on. `[profile.bench]` inherits `[profile.release]`,
      # where it is off — so anything behind `#[cfg(debug_assertions)]` vanishes
      # and its callers stop compiling. That is a real break nothing else here
      # sees; the benches were uncompilable for some time before this step
      # existed, through green CI.
      #
      # `check` rather than `bench --no-run`: the same breakage, in ~10s instead
      # of ~150s, because the release profile's lto + codegen-units=1 + opt-level=z
      # apply to the whole dependency graph and none of that is needed to find a
      # compile error.
      - name: Check benches (bench profile — debug_assertions off)
        if: matrix.lint
        run: cargo check --profile bench --workspace --all-targets

      # Neither clippy nor rustc sees rustdoc's lints, so broken intra-doc links
      # accumulated silently until the whole workspace was cleaned in one pass.
      # -D warnings keeps them at zero: a link that stops resolving after a
      # rename fails here rather than rotting in the docs.
      - name: Docs
        if: matrix.lint
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace

  # Release targets with no corresponding entry in the `test` matrix. macOS ARM
  # and Windows used to be checked here; they run the full suite now, which
  # compiles strictly more than `cargo check` does, so checking them again
  # would only spend minutes to re-derive a subset of that answer.
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Covers the aarch64 linux release target — check runs build scripts,
          # so target-specific breakage (e.g. ort-sys prebuilt availability)
          # surfaces here instead of at release-tag time.
          - name: Linux ARM
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}
