[package]
name = "kimun-gui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Native GPUI frontend for kimün (ADR-0049)"

[[bin]]
name = "kimun-gui"
path = "src/main.rs"

[features]
# `KIMUN_GUI_FAKE_UPDATE` (a faked release for the manual gate). Off in releases.
fake-update = ["kimun-notes/scripted-updates"]

[dependencies]
chrono = { workspace = true }
kimun-notes = { path = "../tui" }
kimun_core = { path = "../core" }
gpui-kit = "0.10.0"
open = "5"
tokio = { workspace = true }
toml = { workspace = true }
tracing = "0.1"
unicode-segmentation = "1"
# Remote images (`remote_image`): the one HTTP client, as in the terminal
# crate (rustls TLS, no OpenSSL, no system TLS library). Blocking, run on
# tokio's blocking pool. `url` resolves a redirect's `Location`.
ureq = "2"
url = "2"

# Inline images (`inline_image`): header sizes for raster files, plus the
# X11 window icon (`WindowOptions::icon`, an `image::RgbaImage`). GPUI's own
# `image` major; the formats GPUI decodes for an embed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The natural size of an SVG without rendering it. Already in the tree through
# GPUI, same pinned minor.
usvg = "0.46"

# The Windows exe's icon and version resource (see build.rs). A build script's
# `cfg` tests the host, so the dependency is unconditional and build.rs checks
# the target at run time.
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
kimun-notes = { path = "../tui", features = ["scripted-updates"] }
async-trait = "0.1"
gpui-kit = { version = "0.10.0", features = ["test-support"] }
tempfile = "3"

# A real text system for the UI font's tests (`ui_font`): Linux's
# cosmic-text backend, built without system fonts. Already in the tree
# through `gpui-pre-linux`; the same pinned version.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-pre-wgpu = "=0.3.12"
