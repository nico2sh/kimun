[package]
name = "ropetext"
version = "0.1.0"
edition = "2024"
description = "A rope-backed text editing model for terminal editors: text, positions, history, motions and soft-wrap layout."
license = "MIT"
publish = false

[dependencies]
# default-features = false drops `unicode_lines`/`cr_lines`, leaving `\n` as the
# only line break. Ropey's default counts VT, FF, NEL, LS, PS and lone CR as
# breaks too, which disagrees with CommonMark, with pulldown-cmark, and with
# splitting a string on '\n' — a note containing U+2028 would give the editor
# more rows than the markdown parser has lines. Carriage returns are handled on
# construction instead, where the normalisation is visible.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
proptest = "1"
# Oracle for `tests/differential.rs` only, and temporary: it is the implementation
# this crate replaces, kept just long enough to prove the replacement agrees with
# it on the operations both define. Remove once the migration lands. Nothing in
# `src/` may reference it.
ratatui-textarea = "0.9.2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout"
harness = false
