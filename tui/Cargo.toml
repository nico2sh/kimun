[package]
name = "kimun-notes"
version = "0.22.0"
edition = "2024"
description = "A terminal-based notes application"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/nico2sh/kimun"

[[bin]]
name = "kimun"
path = "src/main.rs"

[lib]
name = "kimun_notes"
path = "src/lib.rs"

[dependencies]
kimun_core = { path = "../core", version = "0.2.30" }

clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.5"
thiserror = "2.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-widgets = "0.3.2"
rmcp = { version = "1.7", features = ["server", "transport-io"] }
serde = { workspace = true }
toml = { workspace = true }
itertools = "0.14.0"
log = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tokio = { workspace = true }
async-trait = "0.1"
futures = "0.3"
nucleo = "0.5"
throbber-widgets-tui = "0.11"
chrono = { workspace = true }
pulldown-cmark = { workspace = true }
serde_json = "1.0"
regex = "1"
open = "5"
arboard = "3"
nvim-rs = { version = "0.9", features = ["use_tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
rmpv = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
png = "0.18"
# `src/ropetext` — the built-in editing engine, a workspace crate until it was
# folded in (see its module docs).
# default-features = false drops `unicode_lines`/`cr_lines`, leaving `\n` as the
# only line break. Ropey's default counts VT, FF, NEL, LS, PS and lone CR as
# breaks too, which disagrees with CommonMark, with pulldown-cmark, and with
# splitting a string on '\n' — a note containing U+2028 would give the editor
# more rows than the markdown parser has lines. Carriage returns are handled on
# construction instead, where the normalisation is visible.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# `src/server_client` — the optional RAG server client, likewise a former crate.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Update check + self-update. ureq is a small blocking HTTP client (rustls TLS,
# no OpenSSL) run on spawn_blocking; sha2 verifies downloads; self-replace
# performs the cross-platform live-binary swap.
ureq = "2"
sha2 = "0.10"
self-replace = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# Pins what the editor paints, cell by cell — see tests/editor_render_snapshots.rs.
insta = "1"

[[bench]]
name = "editor_parse"
harness = false

[[bench]]
name = "rope_layout"
harness = false

[[bench]]
name = "rope_edit"
harness = false
