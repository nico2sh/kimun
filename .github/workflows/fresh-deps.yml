# Fresh-deps workflow: re-resolve all dependencies to their newest semver-matching
# versions and build, mirroring what `cargo install` does (it ignores Cargo.lock).
# Catches upstream breakage early — in CI, not in users' installs.
on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

name: fresh-deps

concurrency:
  group: fresh-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-deps:
    name: Build against newest deps
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies to newest semver-matching versions
        run: cargo update

      - name: Build
        run: cargo build --workspace --all-targets
