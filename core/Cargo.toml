[package]
name = "kimun_core"
version = "0.2.31"
authors = ["Nico Hormazábal <mail@nico2sh.com>"]
edition = "2021"
description = "Core library for the Kimün notes application"
license = "MIT"
repository = "https://github.com/nico2sh/kimun"
readme = "README.md"

[dependencies]
##############
# Core Notes #
##############
## Serialization
serde = { workspace = true }
toml = { workspace = true }
## Debug
log = { workspace = true }
env_logger = "0.11"
## Error Handling
thiserror = "2.0"
## DB Stuff
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
## Vault identity (RAG collection key, persisted in .kimun/)
uuid = { version = "1", features = ["v4"] }
## Browse files
ignore = "0.4"
## Hash function
twox-hash = "2.1"
## Regular Expressions
regex = "1.12"
## URL parsing (replaces hand-rolled URL_RX)
url = "2"
# Markdown parsing
pulldown-cmark = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = "0.5"
futures-channel = "0.3"
futures-util = "0.3"
## Async stuff
tokio = { workspace = true }

# Restart Manager, to name the process holding a file kimün cannot rename or
# delete. Windows refuses those operations while any handle is open and its
# error says only "another process" — this is the API the shell's "file in
# use" dialog uses to turn that into a name the user can act on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_RestartManager",
] }

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "indexing"
harness = false
