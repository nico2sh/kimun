name: release-plz

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    # Run even when the release job fails: a failed release must still produce
    # the version-bump PR, otherwise the bump that fixes the release never gets
    # proposed and every subsequent push fails the same way.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # release-plz normally rewrites the release PR's branch whenever main moves,
      # which drops anything added to it; this workflow does not depend on that
      # (the steps below are idempotent whether or not it did). Fetches use the
      # token explicitly, as checkout runs with persist-credentials: false. Keep the notes written there so far (the
      # files main does not have) and put them back below.
      - name: Remember the notes on the open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          branch=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          [ -n "$branch" ] || exit 0
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/$branch:refs/remotes/origin/$branch"
          for f in $(git ls-tree --name-only "origin/$branch" -- release-notes/ | grep -E '^release-notes/[0-9][^/]*\.md$' || true); do
            if ! git cat-file -e "origin/main:$f" 2>/dev/null; then
              git show "origin/$branch:$f" > "$RUNNER_TEMP/notes/$(basename "$f")"
            fi
          done

      - name: Run release-plz PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger
          # pull_request workflows, so release PRs would merge without CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # The empty notes file for the version this release PR releases, for
      # the maintainer to fill in (release-notes/README.md). The `release-notes`
      # check keeps the PR red until they have. The notes remembered above come
      # back if the version is the same; a new version gets a fresh empty file.
      # A PR that does not release the app (its version already has a tag) gets
      # none.
      - name: Put the release notes file on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          if [ -z "$branch" ]; then
            echo "no release PR is open"
            exit 0
          fi
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B "$branch" "origin/$branch"
          if ! python3 .github/scripts/release_notes.py unreleased; then
            echo "the app's version already has a release tag: no notes file"
            exit 0
          fi
          version=$(python3 .github/scripts/release_notes.py version)
          saved="$RUNNER_TEMP/notes/$version.md"
          if [ -f "$saved" ] && [ ! -e "release-notes/$version.md" ]; then
            mkdir -p release-notes
            cp "$saved" "release-notes/$version.md"
          else
            python3 .github/scripts/release_notes.py scaffold "$version"
          fi
          # Whether or not release-plz rewrote the branch, only this version's
          # file belongs on it: drop notes for other versions that main lacks
          # (a stale file from before a version bump).
          for f in $(git ls-files 'release-notes/*.md'); do
            case "$f" in
              "release-notes/$version.md" | release-notes/README.md) ;;
              *) git cat-file -e "origin/main:$f" 2>/dev/null || git rm -qf -- "$f" ;;
            esac
          done
          if [ -n "$(git status --porcelain -- release-notes)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release-notes
            git commit -m "docs: release notes for $version"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          fi
