[package]
name = "kimun-gui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Native GPUI frontend for kimün (ADR-0049)"

[[bin]]
name = "kimun-gui"
path = "src/main.rs"

[dependencies]
kimun-notes = { path = "../tui" }
kimun_core = { path = "../core" }
gpui-kit = "0.9.0"
open = "5"
tokio = { workspace = true }
tracing = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile = "3"
toml = { workspace = true }
