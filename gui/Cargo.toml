[package]
name = "kimun-gui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Native egui frontend for kimün (ADR-0049)"

[[bin]]
name = "kimun-gui"
path = "src/main.rs"

[dependencies]
kimun-notes = { path = "../tui" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
